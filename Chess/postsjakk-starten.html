<h1>Møtet med postsjakken</h1>

<p>
Under militærtjenesten på Odderøya foreslo Sverre Halvorsen
at jeg skulle prøve postsjakk.
</p>

<p>
Jeg meldte meg direkte på i klasse Mester B,
og oppnådde et godt resultat i NM 1972.
</p>

<p>
Dette ble starten på et engasjement som senere skulle vare
i flere tiår.
</p>
