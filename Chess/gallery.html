<!DOCTYPE html>
<html lang="no">
<head>

<meta charset="UTF-8">
<title>Bildegalleri</title>

<style>

body{
    font-family:Georgia,serif;
    background:#f5f5f5;
    max-width:1200px;
    margin:auto;
    padding:40px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.photo{
    background:white;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

.placeholder{
    height:200px;
    background:#d7d7d7;
}

</style>

</head>
<body>

<h1>Bildegalleri</h1>

<div class="grid">

<div class="photo">
<div class="placeholder"></div>
<p>Stavanger-perioden</p>
</div>

<div class="photo">
<div class="placeholder"></div>
<p>Trondheim-perioden</p>
</div>

<div class="photo">
<div class="placeholder"></div>
<p>Randaberg SK</p>
</div>

<div class="photo">
<div class="placeholder"></div>
<p>Internasjonal postsjakk</p>
</div>

</div>

<br>

<a href="index.html">← Tilbake til sjakkhistorien</a>

</body>
</html>
