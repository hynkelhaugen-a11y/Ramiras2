<h1>Skolesjakk og ungdomsår</h1>

<p>
I skolesjakken møtte jeg blant annet Hogne Vik,
Jostein Høivik og Trond Melhus Hansen.
Kampene mot Ganddal med brødrene Monge og senere
Einar Brekken var viktige erfaringer.
</p>

<p>
Etter hvert ble utfordringene større,
og veien gikk videre til Stavanger Sjakklubb.
</p>
