<h1>Trondheim-årene</h1>

<p>
I Trondheim ble det mest bridge,
men jeg spilte også for Arbeidernes Sjakklubb.
</p>

<p>
I Trondhjemsmesterskapet 1976 oppnådde jeg en sterk plassering,
og ratingen steg til 2070.
</p>

<p>
Denne perioden markerte samtidig et vendepunkt
i min brettsjakk-karriere.
</p>
