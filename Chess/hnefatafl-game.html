<!DOCTYPE html><html lang="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hnefatafl Deluxe V3.2</title><style>body{font-family:Georgia;margin:0;background:#efe7d6}header{background:#4b2f1a;color:#fff;padding:12px;text-align:center}.wrap{display:grid;grid-template-columns:1fr 280px;gap:12px;padding:12px}.board{display:grid;grid-template-columns:repeat(11,48px);gap:2px;background:#5b3a1f;padding:8px;width:max-content}.cell{width:48px;height:48px;background:#d7b78a;display:flex;align-items:center;justify-content:center}.corner{background:#6f8f4e}.throne{background:#caa22a}.side{background:#fff;padding:10px;border-radius:8px}.last{outline:3px solid #2e86ff}.capture{outline:3px solid crimson}.log div{cursor:pointer;padding:2px}</style></head><body><header><h2>Hnefatafl Deluxe V3.2</h2></header><div class="wrap"><div><div id="board" class="board"></div></div><div class="side"><h3>Fangede brikker</h3><div>Angripere: <span id="ca">0</span></div><div>Forsvarere: <span id="cd">0</span></div><h3>Trekklogg</h3><div id="log" class="log"></div></div></div><script>const b=document.getElementById('board');const pos=[['C','','','A','A','A','A','A','','','C'],['','','','','','A','','','','',''],['','','','','','A','','','','',''],['A','','','','','D','','','','','A'],['A','','','','D','D','D','','','','A'],['A','A','D','D','D','K','D','D','D','A','A'],['A','','','','D','D','D','','','','A'],['A','','','','','D','','','','','A'],['','','','','','A','','','','',''],['','','','','','A','','','','',''],['C','','','A','A','A','A','A','','','C']];let last=[];const svg={A:'<svg width="34" height="34"><circle cx="17" cy="17" r="15" fill="#7a3f19"/><text x="17" y="22" text-anchor="middle" fill="white">ᚦ</text></svg>',D:'<svg width="34" height="34"><circle cx="17" cy="17" r="15" fill="#888"/><text x="17" y="22" text-anchor="middle" fill="white">ᛏ</text></svg>',K:'<svg width="36" height="36"><circle cx="18" cy="18" r="16" fill="gold"/><text x="18" y="24" text-anchor="middle">♔</text></svg>'};function draw(){b.innerHTML='';for(let r=0;r<11;r++)for(let c=0;c<11;c++){let d=document.createElement('div');d.className='cell';if(pos[r][c]=='C'){d.classList.add('corner');d.textContent='ᚠ';} if(r==5&&c==5)d.classList.add('throne'); if(svg[pos[r][c]]) d.innerHTML=svg[pos[r][c]]; if(last[1]&&last[1][0]==r&&last[1][1]==c)d.classList.add('last'); b.appendChild(d);} } draw(); document.getElementById('log').innerHTML='<div>V3.2 demo klar</div>';</script></body></html>
