<!DOCTYPE html><html lang="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hnefatafl Game</title><style>body{font-family:Georgia,serif;background:#efe7d6;text-align:center;margin:0}#board{display:grid;grid-template-columns:repeat(11,50px);gap:2px;justify-content:center;margin:20px auto}.cell{width:50px;height:50px;background:#d9bc91;display:flex;align-items:center;justify-content:center;cursor:pointer}.corner{background:#77964c}.throne{background:#d4af37}.sel{outline:3px solid blue}.move{outline:3px solid lime}button{margin:10px;padding:8px 14px}</style></head><body><h1>⚔️ Hnefatafl</h1><button onclick="init()">Nytt spill</button><div id="status"></div><div id="board"></div><script>const S=11;let turn='A',sel=null,b=[];function init(){b=[['C','','','A','A','A','A','A','','','C'],['','','','','','A','','','','',''],['','','','','','D','','','','',''],['A','','','','','D','','','','','A'],['A','','','','D','D','D','','','','A'],['A','A','D','D','D','K','D','D','D','A','A'],['A','','','','D','D','D','','','','A'],['A','','','','','D','','','','','A'],['','','','','','D','','','','',''],['','','','','','A','','','','',''],['C','','','A','A','A','A','A','','','C']];turn='A';draw()}function draw(){document.getElementById('status').textContent=turn==='A'?'Angripernes tur':'Forsvarernes tur';const bd=document.getElementById('board');bd.innerHTML='';for(let r=0;r<S;r++)for(let c=0;c<S;c++){let d=document.createElement('div');d.className='cell';if((r==0&&c==0)||(r==0&&c==10)||(r==10&&c==0)||(r==10&&c==10)){d.classList.add('corner');d.textContent='ᚠ'} if(r==5&&c==5)d.classList.add('throne'); let p=b[r][c]; if(p=='A')d.textContent='ᚦ'; if(p=='D')d.textContent='ᛏ'; if(p=='K')d.textContent='♔'; d.onclick=()=>clickCell(r,c); bd.appendChild(d);}} function moves(r,c){let m=[];[[1,0],[-1,0],[0,1],[0,-1]].forEach(v=>{let rr=r+v[0],cc=c+v[1];while(rr>=0&&rr<S&&cc>=0&&cc<S&&b[rr][cc]==''){m.push([rr,cc]);rr+=v[0];cc+=v[1]}});return m} function clickCell(r,c){let p=b[r][c]; if((turn=='A'&&p=='A')||(turn=='D'&&(p=='D'||p=='K'))){sel=[r,c];draw();let cells=document.querySelectorAll('.cell');cells[r*S+c].classList.add('sel');moves(r,c).forEach(x=>cells[x[0]*S+x[1]].classList.add('move'));return;} if(sel){let ok=moves(sel[0],sel[1]).some(x=>x[0]==r&&x[1]==c); if(ok){b[r][c]=b[sel[0]][sel[1]];b[sel[0]][sel[1]]=''; if(b[r][c]=='K'&&((r==0&&c==0)||(r==0&&c==10)||(r==10&&c==0)||(r==10&&c==10))) alert('Kongen vinner!'); turn=turn=='A'?'D':'A'; sel=null; draw();}}} init();</script></body></html>
