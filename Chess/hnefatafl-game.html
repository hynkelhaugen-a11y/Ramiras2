<!DOCTYPE html><html lang="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hnefatafl V3.1</title><style>body{font-family:Georgia,serif;margin:0;background:#efe6d1}header{background:#4a2f18;color:#fff;padding:10px;text-align:center}.wrap{display:flex;gap:12px;padding:10px}.board{display:grid;grid-template-columns:repeat(11,44px);gap:2px;background:#5a381d;padding:8px}.cell{width:44px;height:44px;background:#d9bc91;display:flex;align-items:center;justify-content:center;cursor:pointer}.side{background:#fff;padding:10px;min-width:260px}.sel{outline:3px solid #06f}.legal{outline:3px solid #4caf50}button{margin:4px}.logitem{cursor:pointer;padding:2px}.logitem:hover{background:#eee}</style></head><body><header><h2>Hnefatafl Deluxe V3.1</h2><button onclick="newGame()">Nytt spill</button><button onclick="undoMove()">Angre trekk</button></header><div class="wrap"><div id="board" class="board"></div><div class="side"><h3>Trekklogg</h3><div id="log"></div><h3>Fangede angripere</h3><div id="capA"></div><h3>Fangede forsvarere</h3><div id="capD"></div></div></div><script>const S=11;let board,current='A',sel=null,history=[],snaps=[],capA=0,capD=0;function start(){board=[['C','','','A','A','A','A','A','','','C'],['','','','','','A','','','','',''],['','','','','','D','','','','',''],['A','','','','','D','','','','','A'],['A','','','','D','D','D','','','','A'],['A','A','D','D','D','K','D','D','D','A','A'],['A','','','','D','D','D','','','','A'],['A','','','','','D','','','','','A'],['','','','','','D','','','','',''],['','','','','','A','','','','',''],['C','','','A','A','A','A','A','','','C']];history=[];snaps=[];capA=0;capD=0;save();draw()}function newGame(){start()}function save(){localStorage.setItem('hnefv31',JSON.stringify({board,current,history,snaps,capA,capD}))}function load(){let s=localStorage.getItem('hnefv31');if(s){let d=JSON.parse(s);board=d.board;current=d.current;history=d.history;snaps=d.snaps;capA=d.capA;capD=d.capD;draw();return true}return false}function draw(){let b=document.getElementById('board');b.innerHTML='';for(let r=0;r<S;r++)for(let c=0;c<S;c++){let d=document.createElement('div');d.className='cell';let p=board[r][c];d.textContent=p==='A'?'ᚦ':p==='D'?'ᛏ':p==='K'?'♔':p==='C'?'ᚠ':'';d.onclick=()=>clickCell(r,c);b.appendChild(d)}document.getElementById('capA').textContent='ᚦ '.repeat(capA);document.getElementById('capD').textContent='ᛏ '.repeat(capD);let lg=document.getElementById('log');lg.innerHTML='';history.forEach((h,i)=>{let e=document.createElement('div');e.className='logitem';e.textContent=(i+1)+'. '+h;e.onclick=()=>restore(i);lg.appendChild(e);});if(sel){let idx=sel.r*S+sel.c;b.children[idx].classList.add('sel');moves(sel.r,sel.c).forEach(m=>b.children[m.r*S+m.c].classList.add('legal'))}}function moves(r,c){let out=[],dirs=[[1,0],[-1,0],[0,1],[0,-1]];for(let d of dirs){let rr=r+d[0],cc=c+d[1];while(rr>=0&&rr<S&&cc>=0&&cc<S&&board[rr][cc]===''){out.push({r:rr,c:cc});rr+=d[0];cc+=d[1];}}return out}function clickCell(r,c){let p=board[r][c];if((current==='A'&&p==='A')||(current==='D'&&(p==='D'||p==='K'))){sel={r,c};draw();return;}if(sel&&moves(sel.r,sel.c).some(m=>m.r===r&&m.c===c)){snaps.push(JSON.stringify({board:JSON.parse(JSON.stringify(board)),current,capA,capD,history:[...history]}));let piece=board[sel.r][sel.c];board[r][c]=piece;board[sel.r][sel.c]='';capture(r,c,piece);history.push(piece+': '+sel.r+','+sel.c+'→'+r+','+c);current=current==='A'?'D':'A';sel=null;save();draw();}}function capture(r,c,piece){let dirs=[[1,0],[-1,0],[0,1],[0,-1]];for(let d of dirs){let r1=r+d[0],c1=c+d[1],r2=r+d[0]*2,c2=c+d[1]*2;if(r2<0||c2<0||r2>=S||c2>=S)continue;let enemy=board[r1]?.[c1];if(piece==='A'&&enemy==='D'&&board[r2][c2]==='A'){board[r1][c1]='';capD++;}if((piece==='D'||piece==='K')&&enemy==='A'&&(board[r2][c2]==='D'||board[r2][c2]==='K')){board[r1][c1]='';capA++;}}}function undoMove(){if(!snaps.length)return;let s=JSON.parse(snaps.pop());board=s.board;current=s.current;capA=s.capA;capD=s.capD;history=s.history;save();draw()}function restore(i){if(i<snaps.length){let s=JSON.parse(snaps[i]);board=s.board;current=s.current;capA=s.capA;capD=s.capD;draw();}}if(!load())start();</script></body></html>
