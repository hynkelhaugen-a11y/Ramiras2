<!DOCTYPE html><html lang="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hnefatafl Deluxe V2</title><style>body{font-family:Georgia,serif;background:#eadfca;margin:0;padding:20px}#wrap{display:flex;gap:20px;flex-wrap:wrap}.board{display:grid;grid-template-columns:repeat(11,50px);gap:2px;background:#5a381d;padding:10px}.c{width:50px;height:50px;background:#d9bc91;display:flex;align-items:center;justify-content:center;cursor:pointer}.corner{background:#77964c}.throne{background:#d4af37}.sel{outline:3px solid blue}.legal{outline:3px solid lime}#hist{background:white;padding:10px;max-width:300px;height:500px;overflow:auto}</style></head><body><h1>Hnefatafl Deluxe V2</h1><button onclick="newGame()">Nytt spill</button><div id="status"></div><div id="wrap"><div id="b" class="board"></div><div id="hist"></div></div><script>const S=11;let p='A',sel=null,m=1,bd=[];function setup(){return [['C','','','A','A','A','A','A','','','C'],['','','','','','A','','','','',''],['','','','','','A','','','','',''],['A','','','','','D','','','','','A'],['A','','','','D','D','D','','','','A'],['A','A','D','D','D','K','D','D','D','A','A'],['A','','','','D','D','D','','','','A'],['A','','','','','D','','','','','A'],['','','','','','A','','','','',''],['','','','','','A','','','','',''],['C','','','A','A','A','A','A','','','C']]}function newGame(){bd=setup();p='A';m=1;document.getElementById('hist').innerHTML='';draw()}function draw(){status.textContent=p==='A'?'Angripere':'Forsvarere';b.innerHTML='';for(let r=0;r<S;r++)for(let c=0;c<S;c++){let d=document.createElement('div');d.className='c';let x=bd[r][c];if(x==='C'){d.classList.add('corner');d.textContent='ᚠ'} if(r===5&&c===5)d.classList.add('throne'); if(x==='A')d.textContent='ᚦ'; if(x==='D')d.textContent='ᛏ'; if(x==='K')d.textContent='♔'; d.onclick=()=>clickCell(r,c); b.appendChild(d)}}function moves(r,c){let a=[];[[1,0],[-1,0],[0,1],[0,-1]].forEach(v=>{let rr=r+v[0],cc=c+v[1];while(rr>=0&&rr<S&&cc>=0&&cc<S&&bd[rr][cc]===''){a.push([rr,cc]);rr+=v[0];cc+=v[1]}});return a}function clickCell(r,c){let x=bd[r][c];if((p==='A'&&x==='A')||(p==='D'&&(x==='D'||x==='K'))){sel=[r,c];drawMarks();return} if(sel){let ok=moves(sel[0],sel[1]).some(v=>v[0]==r&&v[1]==c); if(ok){let piece=bd[sel[0]][sel[1]];bd[r][c]=piece;bd[sel[0]][sel[1]]='';capture(r,c); hist.innerHTML+=m+++'. '+piece+' '+sel+'→'+[r,c]+'<br>'; if(piece==='K'&&((r===0&&c===0)||(r===0&&c===10)||(r===10&&c===0)||(r===10&&c===10))) alert('Kongen vinner!'); p=p==='A'?'D':'A'; sel=null; draw();}}}function drawMarks(){draw(); let cells=document.querySelectorAll('.c'); cells[sel[0]*S+sel[1]].classList.add('sel'); moves(sel[0],sel[1]).forEach(v=>cells[v[0]*S+v[1]].classList.add('legal'))}function capture(r,c){let side=bd[r][c]; [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{let r1=r+d[0],c1=c+d[1],r2=r+d[0]*2,c2=c+d[1]*2; if(r2<0||r2>=S||c2<0||c2>=S)return; let e=bd[r1]?.[c1]; if(side==='A'&&e==='D'&&bd[r2][c2]==='A') bd[r1][c1]=''; if((side==='D'||side==='K')&&e==='A'&&(bd[r2][c2]==='D'||bd[r2][c2]==='K')) bd[r1][c1]='';});}newGame();</script></body></html>
