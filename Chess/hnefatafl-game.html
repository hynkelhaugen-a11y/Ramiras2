<!DOCTYPE html><html lang="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hnefatafl Deluxe V3 Minimal</title><style>body{font-family:Georgia,serif;background:#efe6d2;margin:0}#wrap{display:flex;gap:16px;padding:16px}.board{display:grid;grid-template-columns:repeat(11,48px);gap:2px;background:#5a381d;padding:10px}.cell{width:48px;height:48px;background:#d9bc91;display:flex;align-items:center;justify-content:center;cursor:pointer}.side{background:#fff;padding:12px;min-width:260px}svg{width:34px;height:34px}.sel{outline:3px solid #1e90ff}</style></head><body><div id="wrap"><div><h2>Hnefatafl Deluxe V3 Minimal</h2><div id="board" class="board"></div></div><div class="side"><h3>Trekklogg</h3><div id="log"></div><h3>Fangede brikker</h3><div>Angripere: <span id="ca">0</span></div><div>Forsvarere: <span id="cd">0</span></div></div></div><script>const S=11;let sel=null,moves=[];let ca=0,cd=0;const b=[['C','','','A','A','A','A','A','','','C'],['','','','','','A','','','','',''],['','','','','','D','','','','',''],['A','','','','','D','','','','','A'],['A','','','','D','D','D','','','','A'],['A','A','D','D','D','K','D','D','D','A','A'],['A','','','','D','D','D','','','','A'],['A','','','','','D','','','','','A'],['','','','','','D','','','','',''],['','','','','','A','','','','',''],['C','','','A','A','A','A','A','','','C']];function piece(t){if(t=='A')return '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#7a3f19"/><text x="50" y="62" text-anchor="middle" fill="white" font-size="40">ᚦ</text></svg>';if(t=='D')return '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#888"/><text x="50" y="62" text-anchor="middle" fill="white" font-size="40">ᛏ</text></svg>';if(t=='K')return '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="gold"/><text x="50" y="62" text-anchor="middle" fill="#533" font-size="40">♔</text></svg>';return '';}function draw(){let bd=document.getElementById('board');bd.innerHTML='';for(let r=0;r<S;r++)for(let c=0;c<S;c++){let d=document.createElement('div');d.className='cell';if(b[r][c]=='C'){d.textContent='ᚠ'}else d.innerHTML=piece(b[r][c]);d.onclick=()=>clickCell(r,c);bd.appendChild(d)}}function clickCell(r,c){if(b[r][c]&&b[r][c]!='C'){sel={r,c};return;} if(sel){b[r][c]=b[sel.r][sel.c];b[sel.r][sel.c]='';document.getElementById('log').innerHTML+=`<div>${sel.r},${sel.c} → ${r},${c}</div>`; sel=null; draw();}}draw();</script></body></html>
