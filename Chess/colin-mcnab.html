<h1>Partiet mot Colin McNab</h1>

<p>
Partiet mot den skotske stormesteren Colin McNab
er blant de viktigste partiene jeg har spilt.
</p>

<p>
Oppgjøret ble spilt på førstebord for Norge
under lag-EM.
</p>

<p>
Partiet ble senere omtalt i Tim Hardings bok
«64 Great Chess Games – Masterpieces of Postal and Email Chess».
</p>
