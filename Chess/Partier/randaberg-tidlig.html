<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Partidatabase | Ramiras Chess</title>

<style>
body{
    margin:0;
    background:#f5f7fa;
    font-family:Georgia, serif;
    color:#222;
}

header{
    background:#1f2937;
    color:white;
    text-align:center;
    padding:50px 20px;
}

header h1{
    margin:0;
}

main{
    max-width:1400px;
    margin:auto;
    padding:30px;
}

.info,
.viewer{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.1);
    margin-bottom:20px;
}

iframe{
    width:100%;
    height:950px;
    border:none;
}

footer{
    text-align:center;
    margin:40px 0;
    color:#666;

@media (max-width:900px){
    iframe{height:800px;}
}

@media (max-width:600px){

<body>

        mellom partiene i databasen.
    </p>
</div>

<div class="viewer">

<iframe
    src="https://share.chessbase.com/SharedGames/frame/?p=T/qhRYEuVI2Q+q4MfSgSYkl5l3icwWkQ0EBm2PKSzHNyVvhIifEseeU78653k8JL"

    Ramiras Chess Archive
