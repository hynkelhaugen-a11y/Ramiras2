body{
    margin:0;

    text-align:center;

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

}

.card{
    background:white;

    padding:24px;
}

.card h3{
    margin-top:0;
}

.card a{
    color:#1d3f7a;
    text-decoration:none;
    font-weight:bold;
}

.card a:hover{
    text-decoration:underline;
}
