nav{
    background:#355f92;
    text-align:center;
    padding:15px;
    margin-bottom:20px;
    border-radius:8px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 12px;
    font-weight:bold;
    padding:8px 12px;
}

nav a:hover{
    background:white;
    color:#355f92;
    border-radius:4px;
}
